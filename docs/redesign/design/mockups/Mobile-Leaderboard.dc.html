<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quindici mobile, daily leaderboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2BCE8;text-decoration:none}a:hover{color:#FFF6E5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #1D1A3A; background-image: linear-gradient(#2A2654 1px, transparent 1px), linear-gradient(90deg, #2A2654 1px, transparent 1px); background-size: 32px 32px; color: #FFF6E5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #1D1A3A; border-bottom: 3px solid #120F26">
<a href="Mobile-Start.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; color: #FFF6E5; font: 400 19px Bungee, 'Arial Black', sans-serif"><span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; box-sizing: border-box; border-radius: 8px; background: #FF9EC7; border: 3px solid #120F26; box-shadow: 3px 3px 0 #120F26; color: #120F26; font-size: 13px">15</span>quindici</a>
<button aria-label="How the score works" style="width: 44px; height: 44px; border-radius: 10px; border: 3px solid #120F26; background: #8DE8EC; box-shadow: 3px 3px 0 #120F26; color: #120F26; font: 400 16px Bungee, 'Arial Black', sans-serif; cursor: pointer">?</button>
</header>
<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em; color: #8DE8EC">DAILY NO. 1 · PAR 48</div>
<h1 style="margin: 0; font: 400 28px/1 Bungee, 'Arial Black', sans-serif; color: #FFE27A; text-shadow: 3px 3px 0 #120F26">Leaderboard</h1>
</div>
<div role="group" aria-label="Range" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #120F26">
<button aria-pressed="true" style="height: 40px; padding: 0 14px; box-sizing: border-box; border-radius: 8px; border: 2px solid #120F26; background: #FFE27A; color: #120F26; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">Today</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; color: #C2BCE8; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">This week</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; color: #C2BCE8; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">Friends</button>
</div>
<ol aria-label="Rankings" style="margin: 0; padding: 6px; list-style: none; display: flex; flex-direction: column; font-size: 15px; border-radius: 14px; background: #2A2654; border: 3px solid #120F26; box-shadow: 4px 4px 0 #120F26">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<sc-if value="{{r.other}}" hint-placeholder-val="{{true}}">
<li style="display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 50px; align-items: center; column-gap: 10px; padding: 0 10px; height: 44px; border-top: 2px solid #1D1A3A">
<span><sc-if value="{{r.top}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; background: {{r.chip}}; border: 2px solid #120F26; color: #120F26; font: 500 12px 'JetBrains Mono', ui-monospace, monospace">{{r.rank}}</span></sc-if><sc-if value="{{r.plain}}" hint-placeholder-val="{{true}}"><span style="font: 500 13px 'JetBrains Mono', ui-monospace, monospace; color: #C2BCE8">{{r.rank}}</span></sc-if></span>
<span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
<span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; color: #C2BCE8">{{r.moves}} · {{r.time}}</span>
<span style="text-align: right; font: 400 17px Bungee, 'Arial Black', sans-serif; color: #FFE27A">{{r.score}}</span>
</li>
</sc-if>
<sc-if value="{{r.you}}" hint-placeholder-val="{{false}}">
<li aria-current="true" style="display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 50px; align-items: center; column-gap: 10px; padding: 0 10px; height: 46px; margin: 3px 0; box-sizing: border-box; border-radius: 10px; background: #FF9EC7; border: 3px solid #120F26; box-shadow: 3px 3px 0 #120F26; color: #120F26">
<span style="font: 500 13px 'JetBrains Mono', ui-monospace, monospace">{{r.rank}}</span>
<span style="font-weight: 600">You</span>
<span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace">{{r.moves}} · {{r.time}}</span>
<span style="text-align: right; font: 400 17px Bungee, 'Arial Black', sans-serif">{{r.score}}</span>
</li>
</sc-if>
</sc-for>
</ol>
<p style="margin: 0; font-size: 12px; text-align: center; color: #C2BCE8">Moves · time · score = 1000 × precision × pace</p>
</main>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #1D1A3A; border-top: 3px solid #120F26">
<a href="Mobile-Start.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-size: 14px; font-weight: 500">Daily</a>
<a href="Mobile-Start.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-size: 14px; font-weight: 500">Free play</a>
<a href="Mobile-Solver.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-size: 14px; font-weight: 500">Solver</a>
<a href="Mobile-Leaderboard.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 60px; font-size: 14px; font-weight: 600"><span style="padding: 6px 10px; border-radius: 8px; background: #FFE27A; border: 2px solid #120F26; box-shadow: 2px 2px 0 #120F26; color: #120F26">Ranks</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var par = 48;
var CH = ['#FFE27A', '#8DE8EC', '#C9B3FF'];
var D = [['nico',48,74],['tessera',50,61],['halfstep',48,131],['mk_slides',50,88],['ortho',52,97],['lento',48,212],['paritybit',54,83],['you',56,96],['blank16',58,70],['rowmajor',56,142]];
var rows = D.map(function (d) { var s = Math.round(1000 * Math.pow(par / d[1], 2) * (0.5 + 0.5 * Math.pow(2, -d[2] / (3 * par)))); var sec = d[2] % 60;
return { name: d[0], moves: d[1], over: d[1] === par ? 'par' : '+' + (d[1] - par), time: Math.floor(d[2] / 60) + ':' + (sec < 10 ? '0' : '') + sec, score: s, you: d[0] === 'you', other: d[0] !== 'you' }; });
rows.sort(function (a, b) { return b.score - a.score; });
rows.forEach(function (r, i) { r.rank = i + 1; r.top = i < 3; r.plain = i >= 3; r.chip = CH[i] || ''; });
return { rows: rows };
}
}
</script>
</body>
</html>
